place": "Asturias, España", "observer": "claucar", "obs_id": 298558225}, {"category": "Mamíferos y cetáceos", "species": "Vulpes vulpes", "common": "Red Fox", "lat": 43.4202672764, "lng": -4.8897610051, "observed_on": "2024-02-07", "place": "Lugar Turancias, Llanes, Asturias, ES", "observer": "japulgar", "obs_id": 198637723}, {"category": "Mamíferos y cetáceos", "species": "Vulpes vulpes", "common": "Red Fox", "lat": 43.370727, "lng": -4.399756, "observed_on": "2022-08-23", "place": "39549 San Vicente de la Barquera, Cantabria, España", "observer": "alejandroro", "obs_id": 132109457}, {"category": "Mamíferos y cetáceos", "species": "Vulpes vulpes", "common": "Red Fox", "lat": 43.1442777, "lng": -4.62334267, "observed_on": "2022-04-22", "place": "Potes, 39570, Cantabria, España", "observer": "urogallina", "obs_id": 112404275}, {"category": "Mamíferos y cetáceos", "species": "Sciurus vulgaris", "common": "Iberian Red Squirrel", "lat": 43.32185514, "lng": -4.3379597318, "observed_on": "2026-04-05", "place": "Barrio Roiz el Mazo, Valdáliga, Cantabria, ES", "observer": "alejandro84012", "obs_id": 348325552}, {"category": "Mamíferos y cetáceos", "species": "Sciurus vulgaris", "common": "Iberian Red Squirrel", "lat": 43.2107037558, "lng": -4.317193433, "observed_on": "2025-11-18", "place": "Cantabria, ES-CB, ES", "observer": "nachogarcia56", "obs_id": 329215741}, {"category": "Mamíferos y cetáceos", "species": "Sciurus vulgaris", "common": "Iberian Red Squirrel", "lat": 43.1654134325, "lng": -4.6945082968, "observed_on": "2025-10-31", "place": "Cantabria, Spain", "observer": "bkogo", "obs_id": 325013766}, {"category": "Mamíferos y cetáceos", "species": "Sus scrofa", "common": "Wild Boar", "lat": 43.3051661, "lng": -4.7701567, "observed_on": "2026-04-27", "place": "33554, Asturias, Spanje", "observer": "tim_stevens1", "obs_id": 356185393}, {"category": "Mamíferos y cetáceos", "species": "Sus scrofa", "common": "Wild Boar", "lat": 43.3051764, "lng": -4.7701764997, "observed_on": "2026-04-27", "place": "Principado de Asturias, ES-AS-AS, ES", "observer": "tim_stevens1", "obs_id": 355499411}, {"category": "Mamíferos y cetáceos", "species": "Sus scrofa", "common": "Wild Boar", "lat": 43.4185151119, "lng": -4.7790624664, "observed_on": "2025-06-10", "place": "Asturias, España", "observer": "claucar", "obs_id": 296472799}, {"category": "Mamíferos y cetáceos", "species": "Meles meles", "common": "European Badger", "lat": 43.4132101298, "lng": -4.745904319, "observed_on": "2026-04-05", "place": "Llanes, Llanes, 33500 Llanes, Asturias, España", "observer": "carramuxeira", "obs_id": 347598602}, {"category": "Mamíferos y cetáceos", "species": "Meles meles", "common": "European Badger", "lat": 43.3837317997, "lng": -4.3627757, "observed_on": "2026-04-02", "place": "39547 San Vicente de la Barquera, Cantabria, España", "observer": "laorden", "obs_id": 346975785}, {"category": "Mamíferos y cetáceos", "species": "Meles meles", "common": "European Badger", "lat": 43.3896444444, "lng": -4.4452944444, "observed_on": "2026-03-12", "place": "39548 San Vicente de la Barquera, Cantabria, España", "observer": "alexanacardo", "obs_id": 342559844}, {"category": "Mamíferos y cetáceos", "species": "Genetta genetta", "common": "Northern Small-spotted Genet", "lat": 43.3783071241, "lng": -4.5255690164, "observed_on": "2025-05-14", "place": "Asturias, España", "observer": "sympetrum", "obs_id": 284546165}, {"category": "Mamíferos y cetáceos", "species": "Lutra lutra", "common": "Eurasian Otter", "lat": 43.4140172492, "lng": -4.7558801249, "observed_on": "2026-03-27", "place": "Estación de Autobuses de Llanes, Llanes, 33500 Llanes, Asturias, España", "observer": "carramuxeira", "obs_id": 345642454}, {"category": "Mamíferos y cetáceos", "species": "Lutra lutra", "common": "Eurasian Otter", "lat": 43.4208, "lng": -4.7488, "observed_on": "2025-09-30", "place": "Cantabria, Espagne", "observer": "marcameels", "obs_id": 318846558}, {"category": "Mamíferos y cetáceos", "species": "Lutra lutra", "common": "Eurasian Otter", "lat": 43.410502507, "lng": -4.7635061441, "observed_on": "2024-01-01", "place": "Pancar, Llanes, Asturias, España", "observer": "antoniotorralba", "obs_id": 197733090}, {"category": "Mamíferos y cetáceos", "species": "Rupicapra pyrenaica", "common": "Pyrenean Chamois", "lat": 43.2271023, "lng": -4.79267, "observed_on": "2026-04-28", "place": "33554, Asturias, Espanha", "observer": "patriciaisaisa", "obs_id": 358979019}, {"category": "Mamíferos y cetáceos", "species": "Rupicapra pyrenaica", "common": "Pyrenean Chamois", "lat": 43.2376077995, "lng": -4.8149971848, "observed_on": "2026-04-16", "place": "Principado de Asturias, ES-AS-AS, ES", "observer": "alcoxte", "obs_id": 350493348}, {"category": "Mamíferos y cetáceos", "species": "Rupicapra pyrenaica", "common": "Pyrenean Chamois", "lat": 43.2089519691, "lng": -4.7647766035, "observed_on": "2026-04-04", "place": "Parque Nacional de los Picos de Europa, Cabrales, Asturias, ES", "observer": "selenemgz", "obs_id": 347369841}, {"category": "Mamíferos y cetáceos", "species": "Delphinus delphis", "common": "Common Dolphin", "lat": 43.5344550266, "lng": -4.7947866689, "observed_on": "2020-08-11", "place": "Spain", "observer": "marquimedes", "obs_id": 62059060}];
const colors = {"Flora — Endemismos cantábricos": "#7e3f9c", "Flora — Orquídeas": "#d63384", "Flora — Plantas carnívoras": "#198754", "Flora — Lirios y prado": "#fd7e14", "Flora — Costera": "#0dcaf0", "Aves — estivales y bosque": "#0d6efd", "Aves — marismas / costa": "#20c997", "Aves — alta montaña": "#6f42c1", "Mariposas": "#ffc107", "Anfibios y reptiles": "#198038", "Hongos primaverales": "#a52a2a", "Mamíferos y cetáceos": "#495057"};

// Quitar el mensaje de carga al iniciar Leaflet
const loadingEl = document.getElementById('loading-msg');
if (loadingEl) loadingEl.remove();

const map = L.map('map').setView([43.385, -4.53], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19
}).addTo(map);

// Centro La Revilla
L.circleMarker([43.385, -4.53], {
  radius: 8, color: '#222', weight: 2, fillColor: '#fff', fillOpacity: 1
}).addTo(map).bindPopup('<b>La Revilla</b><br>centro de búsqueda');

// Cluster por categoría (cada uno es una capa toggleable)
const layers = {};
for (const cat of Object.keys(colors)) {
  layers[cat] = L.markerClusterGroup({ disableClusteringAtZoom: 14, maxClusterRadius: 45 });
}

function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

observations.forEach(o => {
  const color = colors[o.category] || '#888';
  const icon = L.divIcon({
    className: 'naturalist-pin',
    html: `<div style="background:${color};width:14px;height:14px;border-radius:50%;border:2px solid white;box-shadow:0 0 4px rgba(0,0,0,0.6);"></div>`,
    iconSize: [14,14], iconAnchor: [7,7]
  });
  const m = L.marker([o.lat, o.lng], { icon });
  const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${o.lat},${o.lng}`;
  const inatUrl = `https://www.inaturalist.org/observations/${o.obs_id}`;
  const html = `
    <div class="pop-sci">${escapeHtml(o.species)}</div>
    ${o.common ? `<div class="pop-com">${escapeHtml(o.common)}</div>` : ''}
    <div class="pop-meta">📅 ${escapeHtml(o.observed_on || 's/f')} · 👤 @${escapeHtml(o.observer)}</div>
    ${o.place ? `<div class="pop-meta">📌 ${escapeHtml(o.place)}</div>` : ''}
    <div class="pop-meta" style="color:#888;font-size:11px;">${escapeHtml(o.category)}</div>
    <div class="pop-actions">
      <a class="primary" href="${mapsUrl}" target="_blank">📍 Cómo llegar</a>
      <a href="${inatUrl}" target="_blank">iNat</a>
    </div>
  `;
  m.bindPopup(html);
  if (layers[o.category]) layers[o.category].addLayer(m);
});

for (const lg of Object.values(layers)) lg.addTo(map);

// Control de capas (encender/apagar grupos)
const overlays = {};
for (const [cat, lg] of Object.entries(layers)) {
  const dot = `<span class="legend-dot" style="background:${colors[cat]}"></span>`;
  const count = observations.filter(o => o.category === cat).length;
  overlays[`${dot} ${cat} <span style="color:#888">(${count})</span>`] = lg;
}
L.control.layers(null, overlays, { collapsed: true, position: 'topright' }).addTo(map);

// Ajustar bounds a las observaciones
if (observations.length > 0) {
  const bounds = L.latLngBounds(observations.map(o => [o.lat, o.lng]));
  bounds.extend([43.385, -4.53]);
  map.fitBounds(bounds, { padding: [40,40] });
}

// ─── Botón "Mi ubicación" ────────────────────────────────────────────────
let myLocCircle = null;
let myLocMarker = null;
let watching = false;

const LocateBtn = L.Control.extend({
  options: { position: 'bottomright' },
  onAdd: function() {
    const div = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
    div.innerHTML = '<a href="#" id="locateBtn" title="Mi ubicación" ' +
      'style="display:flex;align-items:center;justify-content:center;' +
      'font-size:20px;text-decoration:none;color:#000;background:white;' +
      'width:34px;height:34px;line-height:34px;">📍</a>';
    L.DomEvent.disableClickPropagation(div);
    div.firstChild.onclick = function(e) {
      e.preventDefault();
      const btn = document.getElementById('locateBtn');
      if (watching) {
        map.stopLocate();
        if (myLocCircle) { map.removeLayer(myLocCircle); myLocCircle = null; }
        if (myLocMarker) { map.removeLayer(myLocMarker); myLocMarker = null; }
        btn.style.background = 'white';
        watching = false;
      } else {
        btn.style.background = '#cce5ff';
        watching = true;
        map.locate({ setView: true, maxZoom: 16, watch: true, enableHighAccuracy: true });
      }
    };
    return div;
  }
});
new LocateBtn().addTo(map);

map.on('locationfound', function(e) {
  if (myLocCircle) map.removeLayer(myLocCircle);
  if (myLocMarker) map.removeLayer(myLocMarker);
  myLocCircle = L.circle(e.latlng, {
    radius: e.accuracy, color: '#1a73e8', weight: 1, fillOpacity: 0.15
  }).addTo(map);
  const pulseIcon = L.divIcon({
    html: '<div style="width:14px;height:14px;border-radius:50%;background:#1a73e8;border:3px solid white;box-shadow:0 0 0 2px rgba(26,115,232,0.6),0 0 8px rgba(0,0,0,0.4);"></div>',
    iconSize: [14,14], iconAnchor: [7,7], className: ''
  });
  myLocMarker = L.marker(e.latlng, { icon: pulseIcon, zIndexOffset: 1000 })
    .addTo(map)
    .bindPopup('📍 Estás aquí · precisión ±' + Math.round(e.accuracy) + ' m');
});

map.on('locationerror', function(e) {
  alert('No se pudo acceder a tu ubicación: ' + e.message +
        '\n\nEn iOS, asegúrate de tener la ubicación activada y dado permiso a Safari.');
  const btn = document.getElementById('locateBtn');
  if (btn) btn.style.background = 'white';
  watching = false;
});
</script>
</body>
</html>
