": "Cantabria, ES-CB, ES", "observer": "gbohne", "obs_id": 106089803}];
const colors = {"Plantae": "#198754", "Aves": "#0d6efd", "Insecta": "#ffc107", "Reptilia": "#a52a2a", "Amphibia": "#20c997", "Mammalia": "#495057", "Fungi": "#7e3f9c", "Mollusca": "#fd7e14", "Arachnida": "#d63384", "Animalia": "#888", "Actinopterygii": "#0dcaf0", "Protozoa": "#999", "Chromista": "#888"};
const labels = {"Plantae": "Plantas 🌿", "Aves": "Aves 🐦", "Insecta": "Insectos 🦋", "Reptilia": "Reptiles 🦎", "Amphibia": "Anfibios 🐸", "Mammalia": "Mamíferos 🦊", "Fungi": "Hongos 🍄", "Mollusca": "Moluscos 🐌", "Arachnida": "Arácnidos 🕷️", "Animalia": "Otros animales", "Actinopterygii": "Peces"};

document.getElementById('loading-msg')?.remove();

const map = L.map('map').setView([43.2901147, -4.1448273], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19
}).addTo(map);

L.circle([43.2901147, -4.1448273], {
  radius: 5 * 1000, color:'#222', weight:1, fillOpacity:0.04
}).addTo(map);
L.circleMarker([43.2901147, -4.1448273], {
  radius: 9, color:'#222', weight:2, fillColor:'#ffeb3b', fillOpacity:1
}).addTo(map).bindPopup('<b>Antenas de Ibio</b>').openPopup();

const layers = {};
for (const k of Object.keys(colors)) {
  layers[k] = L.markerClusterGroup({ disableClusteringAtZoom: 15, maxClusterRadius: 40 });
}

function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

observations.forEach(o => {
  const color = colors[o.iconic] || '#888';
  const icon = L.divIcon({
    html: `<div style="background:${color};width:14px;height:14px;border-radius:50%;border:2px solid white;box-shadow:0 0 4px rgba(0,0,0,0.6);"></div>`,
    iconSize:[14,14], iconAnchor:[7,7], className:''
  });
  const m = L.marker([o.lat, o.lng], { icon });
  const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${o.lat},${o.lng}`;
  const inatUrl = `https://www.inaturalist.org/observations/${o.obs_id}`;
  m.bindPopup(`
    <div class="pop-sci">${escapeHtml(o.species)}</div>
    ${o.common ? `<div class="pop-com">${escapeHtml(o.common)}</div>` : ''}
    <div class="pop-meta">📅 ${escapeHtml(o.observed_on || 's/f')} · 👤 @${escapeHtml(o.observer)}</div>
    ${o.place ? `<div class="pop-meta">📌 ${escapeHtml(o.place)}</div>` : ''}
    <div class="pop-meta" style="color:#888;font-size:11px;">${escapeHtml(o.iconic)}</div>
    <div class="pop-actions">
      <a class="primary" href="${mapsUrl}" target="_blank">📍 Cómo llegar</a>
      <a href="${inatUrl}" target="_blank">iNat</a>
    </div>
  `);
  if (layers[o.iconic]) layers[o.iconic].addLayer(m);
});

for (const lg of Object.values(layers)) lg.addTo(map);

const overlays = {};
for (const [k, lg] of Object.entries(layers)) {
  const count = observations.filter(o => o.iconic === k).length;
  if (count === 0) continue;
  const dot = `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${colors[k]};border:2px solid white;box-shadow:0 0 2px rgba(0,0,0,0.4);margin-right:4px;"></span>`;
  overlays[`${dot} ${labels[k] || k} (${count})`] = lg;
}
L.control.layers(null, overlays, { collapsed: true, position: 'topright' }).addTo(map);

if (observations.length > 0) {
  const bounds = L.latLngBounds(observations.map(o => [o.lat, o.lng]));
  bounds.extend([43.2901147, -4.1448273]);
  map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
}
